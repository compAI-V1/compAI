<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;color:#1f2937;margin:42px}h1{color:#111827;border-bottom:2px solid #2563eb;padding-bottom:10px}h2{color:#1d4ed8;margin-top:28px}.subtitle{color:#6b7280}.source{font-size:11px;color:#4b5563;margin:4px 0}</style></head><body><h1>{{ title }}</h1>{% if subtitle %}<p class="subtitle">{{ subtitle }}</p>{% endif %}{% for section in sections %}<h2>{{ section.heading }}</h2><div>{{ section.html_content | safe }}</div>{% endfor %}{% if sources %}<h2>Sources</h2>{% for source in sources %}<p class="source">{{ source.title }} — {{ source.url }}</p>{% endfor %}{% endif %}</body></html>
